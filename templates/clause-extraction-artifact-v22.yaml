# A false-delivery member remains in both maps; it is never deleted or made not_present.
#   delivered: false
#   size_bytes: null
#   sha256: null
#   part_not_delivered: "EXT-PART-NOT-DELIVERED: <reason>"
# Free text is exactly one scalar; never concatenate prose after a quoted scalar.
#   statement: |-
#     Complete unresolved text goes here.

# v2.1 absence assessment is allowed only on coverage rows. release-owned Compose, not this Agent declaration, verifies source capture and exactly-once identity. A not_present row requires
# a release-fixed captured source declaration; semantic uncertainty is blank with debt.
# absence_assessment:
#   conclusion: not_established
