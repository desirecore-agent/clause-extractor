#   confidence: low
#   human_confirmation_required: false
#   debt_codes: [EXT-SEMANTIC-METHOD-UNSUPPORTED]

# Positive evidence: exact_quote is a non-empty Grep result with utf16_offsets: [0] or more offsets.
# Null evidence: exact_quote: null with grep_state: not_found|unavailable and utf16_offsets: [].
# Candidate ambiguity evidence is positive only: grep_state: matched and non-empty utf16_offsets.
