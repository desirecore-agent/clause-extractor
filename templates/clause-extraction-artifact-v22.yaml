# Canonical v2.1 authoring skeleton. It is YAML-parseable but intentionally partial.
# It is not a v1a/v1b-valid final artifact and must never be handed off as passed.
# v2.2 representation declaration: exactly one entry per delivered part and none per undelivered part. An all-undelivered artifact uses []. This is Agent data;
# only a future same-call generic Compose derived-source operand can bind DOCX metadata.
# source_representations:
#   - part_id: body
#     source_name: part_0
#     source_sha256: <original-frozen-docx-sha256>
#     source_size_bytes: <original-byte-count>
#     format: docx
#     representation: {kind: canonical_text, derived_text_sha256: <canonical-utf8-sha256>, text_offset_codec: utf16_code_unit, derived_text_utf16_code_units: <integer>}

